# Fast checks before each commit, the full gate before each push.
pre-commit:
  parallel: true
  jobs:
    - name: biome
      glob: "*.{ts,tsx,js,json,jsonc,css}"
      run: pnpm biome check --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
    - name: typecheck
      glob: "*.{ts,tsx}"
      run: pnpm typecheck

pre-push:
  jobs:
    - name: check
      run: pnpm check
